<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ToolX – Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // into a query parameter 'p', then redirects to the repository root.
      // E.g. https://jitender130.github.io/TOOL-X/tools -> https://jitender130.github.io/TOOL-X/?p=/tools
      var pathSegmentsToKeep = 1; // 1 segment for https://<username>.github.io/<repo-name>/

      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/?p=/' + routePath +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash;

      l.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to ToolX...</p>
  </body>
</html>
