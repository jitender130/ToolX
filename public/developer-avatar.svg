<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cbb1" />
      <stop offset="50%" stop-color="#e8af8a" />
      <stop offset="100%" stop-color="#d49770" />
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="tie-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)" />

  <!-- Code/Tech Pattern Background elements -->
  <g opacity="0.12" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">
    <text x="30" y="50">&lt;developer&gt;</text>
    <text x="260" y="80">&lt;React /&gt;</text>
    <text x="40" y="140">const jitender = {</text>
    <text x="270" y="170">role: 'dev'</text>
    <text x="300" y="240">&lt;code /&gt;</text>
    <text x="30" y="270">skills: ['AI', 'Web']</text>
  </g>

  <!-- Ambient Glow circle behind head -->
  <circle cx="200" cy="180" r="140" fill="url(#glow-grad)" />

  <!-- Shoulders & Dark Suit Jacket -->
  <path d="M 60 400 C 70 330, 110 290, 150 280 L 250 280 C 290 290, 330 330, 340 400 Z" fill="url(#suit-grad)" filter="url(#shadow)" />
  <path d="M 100 400 L 145 305 L 180 395 Z" fill="#0f172a" opacity="0.6" />
  <path d="M 300 400 L 255 305 L 220 395 Z" fill="#0f172a" opacity="0.6" />

  <!-- Crisp White Shirt Collar -->
  <polygon points="170,270 200,315 155,305" fill="#f8fafc" />
  <polygon points="230,270 200,315 245,305" fill="#f1f5f9" />
  <polygon points="175,270 200,340 225,270" fill="#ffffff" />

  <!-- Emerald Green Tie -->
  <polygon points="194,310 206,310 210,380 200,400 190,380" fill="url(#tie-grad)" />
  <polygon points="192,305 208,305 204,318 196,318" fill="#059669" />

  <!-- Neck -->
  <path d="M 175 220 L 175 275 C 185 285, 215 285, 225 275 L 225 220 Z" fill="url(#skin-grad)" />
  <!-- Neck shadow -->
  <path d="M 175 228 C 190 240, 210 240, 225 228 L 225 245 C 210 255, 190 255, 175 245 Z" fill="#b87d55" opacity="0.4" />

  <!-- Ears -->
  <circle cx="138" cy="180" r="14" fill="#e8af8a" />
  <circle cx="138" cy="180" r="7" fill="#d49770" opacity="0.5" />
  <circle cx="262" cy="180" r="14" fill="#e8af8a" />
  <circle cx="262" cy="180" r="7" fill="#d49770" opacity="0.5" />

  <!-- Head / Face -->
  <path d="M 145 160 C 145 225, 160 245, 200 245 C 240 245, 255 225, 255 160 C 255 110, 235 95, 200 95 C 165 95, 145 110, 145 160 Z" fill="url(#skin-grad)" filter="url(#shadow)" />

  <!-- Stylish Modern Hair -->
  <path d="M 140 145 C 135 105, 160 70, 200 68 C 240 70, 265 105, 260 145 C 250 115, 235 105, 200 102 C 160 102, 148 118, 140 145 Z" fill="url(#hair-grad)" />
  <path d="M 150 95 C 175 75, 230 75, 252 92 C 240 80, 210 70, 185 75 Z" fill="#3b3b3b" opacity="0.6" />

  <!-- Eyebrows -->
  <path d="M 160 152 Q 175 146 188 152" stroke="#1f2937" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 212 152 Q 225 146 240 152" stroke="#1f2937" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Eyes with confident warm gaze -->
  <ellipse cx="174" cy="165" rx="6" ry="4" fill="#1e293b" />
  <circle cx="176" cy="163" r="1.5" fill="#ffffff" />
  <ellipse cx="226" cy="165" rx="6" ry="4" fill="#1e293b" />
  <circle cx="228" cy="163" r="1.5" fill="#ffffff" />

  <!-- Glasses (Stylish modern thin frame) -->
  <rect x="156" y="152" width="36" height="25" rx="6" fill="none" stroke="#0f172a" stroke-width="2.5" opacity="0.85" />
  <rect x="208" y="152" width="36" height="25" rx="6" fill="none" stroke="#0f172a" stroke-width="2.5" opacity="0.85" />
  <line x1="192" y1="162" x2="208" y2="162" stroke="#0f172a" stroke-width="2.5" />
  <line x1="156" y1="162" x2="140" y2="166" stroke="#0f172a" stroke-width="2" />
  <line x1="244" y1="162" x2="260" y2="166" stroke="#0f172a" stroke-width="2" />

  <!-- Nose -->
  <path d="M 198 166 L 195 188 L 204 188" stroke="#b87d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Warm Confident Smile -->
  <path d="M 184 206 Q 200 218 216 206" stroke="#8c4434" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 188 206 Q 200 213 212 206" fill="#ffffff" opacity="0.9" />

  <!-- Subtle Beard / Goatee / Trim -->
  <path d="M 188 226 Q 200 234 212 226" stroke="#262626" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- Badge in corner: Verified Developer -->
  <g transform="translate(315, 315)">
    <circle cx="25" cy="25" r="24" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#shadow)" />
    <path d="M 18 25 L 23 30 L 32 19" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
